        cat >/etc/apt/sources.list.d/zabbly-incus-lts-7.0.sources <<EOF
        Enabled: yes
        Types: deb
        URIs: https://pkgs.zabbly.com/incus/lts-7.0
        Suites: $(. /etc/os-release && echo "${VERSION_CODENAME}")
        Components: main
        Architectures: $(dpkg --print-architecture)
        Signed-By: /etc/apt/keyrings/zabbly.asc
        EOF
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          btrfs-progs \
          incus-base \
          ovn-central \
          ovn-host
        curl -fsSL https://tailscale.com/install.sh | sh
        usermod -aG incus-admin laborant
        systemctl enable incus openvswitch-switch ovn-central ovn-host tailscaled
        systemctl start incus openvswitch-switch ovn-host tailscaled
        systemctl stop ovn-central
