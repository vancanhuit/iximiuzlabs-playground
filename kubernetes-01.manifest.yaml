kind: playground
name: kubernetes-01
base: flexbox
title: Kubernetes 01
categories:
  - linux
  - networking
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: control-plane-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 40GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: node-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 40GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 4
        ramSize: 4GiB
    - name: node-02
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 40GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: node-03
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
  tabs:
    - id: terminal-control-plane-01
      kind: terminal
      name: control-plane-01
      machine: control-plane-01
    - id: terminal-node-01
      kind: terminal
      name: node-01
      machine: node-01
    - id: terminal-node-02
      kind: terminal
      name: node-02
      machine: node-02
    - id: terminal-node-03
      kind: terminal
      name: node-03
      machine: node-03
  initTasks:
    init_control_plane_01_1:
      name: init_control_plane_01_1
      machine: control-plane-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
    init_node_01_1:
      name: init_node_01_1
      machine: node-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
    init_node_02_1:
      name: init_node_02_1
      machine: node-02
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
    init_node_03_1:
      name: init_node_03_1
      machine: node-03
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner
