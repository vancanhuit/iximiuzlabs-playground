kind: playground
name: kubernetes-01-cb774b8c
base: flexbox
title: Kubernetes 01
categories:
    - linux
    - networking
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: control-plane-01
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
              mount: /
              size: 40GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 4GiB
        - name: control-plane-02
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
              mount: /
              size: 40GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 4GiB
        - name: control-plane-03
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
              mount: /
              size: 40GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 4GiB
        - name: control-plane
