              size: 15GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 2GiB
    tabs:
        - id: terminal-control-plane-01
          kind: terminal
          name: control-plane-01
          machine: control-plane-01
        - id: terminal-control-plane-02
          kind: terminal
          name: control-plane-02
          machine: control-plane-02
        - id: terminal-control-plane-03
          kind: terminal
          name: control-plane-03
          machine: control-plane-03
        - id: terminal-control-plane
          kind: terminal
          name: control-plane
          machine: control-plane
