          kind: terminal
          name: haproxy-01
          machine: haproxy-01
    initTasks:
        init_control_plane_1:
            name: init_control_plane_1
            machine: control-plane
            init: true
            user: root
            timeout_seconds: 300
            run: |-
                #!/bin/bash

                curl -fsSL https://tailscale.com/install.sh | sh
                systemctl enable --now tailscaled
        init_control_plane_01_1:
            name: init_control_plane_01_1
            machine: control-plane-01
            init: true
