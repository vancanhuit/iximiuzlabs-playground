grafana:
  grafana.ini:
    server:
      domain: grafana.playground.canhdinh.com
      root_url: https://grafana.playground.canhdinh.com
  sidecar:
    datasources:
      extraJsonData:
        manageAlerts: true
        prometheusType: Prometheus
        prometheusVersion: 3.15.1

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

prometheusOperator:
  image:
    tag: v0.94.2
  prometheusConfigReloader:
    image:
      tag: v0.94.2

prometheus:
  prometheusSpec:
    image:
      tag: v3.15.1-distroless
    externalUrl: https://prometheus.playground.canhdinh.com
    retention: 3d
    retentionSize: 8GB

alertmanager:
  alertmanagerSpec:
    externalUrl: https://alertmanager.playground.canhdinh.com
    retention: 72h
