grafana:
  grafana.ini:
    server:
      domain: grafana.playground.canhdinh.com
      root_url: https://grafana.playground.canhdinh.com
  sidecar:
    datasources:
      extraJsonData:
        manageAlerts: true
        prometheusType: Prometheus
        prometheusVersion: 3.14.0

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.playground.canhdinh.com
    retention: 3d
    retentionSize: 8GB

alertmanager:
  alertmanagerSpec:
    externalUrl: https://alertmanager.playground.canhdinh.com
    retention: 72h
