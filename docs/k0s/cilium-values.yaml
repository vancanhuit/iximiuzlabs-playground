cluster:
  name: tailscale-k0s

kubeProxyReplacement: true
rollOutCiliumPods: true

socketLB:
  hostNamespaceOnly: true

bpf:
  datapathMode: veth
  masquerade: true
  hostLegacyRouting: false
  tproxy: true

nodePort:
  directRoutingDevice: tailscale0

# Host-networked Cilium components reach k0s NLLB through this worker-local endpoint.
k8sServiceHost: "127.0.0.1"
k8sServicePort: "7443"

devices:
  - tailscale0
forceDeviceDetection: true

routingMode: tunnel
tunnelProtocol: vxlan
underlayProtocol: ipv4

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16
    clusterPoolIPv4MaskSize: 24

operator:
  replicas: 2
  rollOutPods: true

envoy:
  enabled: true
  rollOutPods: true

gatewayAPI:
  enabled: true
  gatewayClass:
    create: true
  hostNetwork:
    enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
