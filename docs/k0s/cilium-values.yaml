kubeProxyReplacement: true
l7Proxy: false

socketLB:
  hostNamespaceOnly: true

bpf:
  masquerade: true

nodePort:
  directRoutingDevice: tailscale0

# Host-networked Cilium components reach k0s NLLB through this worker-local endpoint.
k8sServiceHost: "127.0.0.1"
k8sServicePort: "7443"

devices:
  - eth0
  - tailscale0

routingMode: tunnel
tunnelProtocol: vxlan
underlayProtocol: ipv4
# tailscale0 uses MTU 1280; reserve 50 bytes for the Cilium VXLAN envelope.
MTU: 1230

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16
    clusterPoolIPv4MaskSize: 24

operator:
  replicas: 2

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
