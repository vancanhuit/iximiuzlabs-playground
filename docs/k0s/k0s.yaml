apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: tailscale-k0s
spec:
  hosts:
  - hostname: control-plane-01
    privateAddress: 100.76.72.67
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.76.72.67
      user: root
      port: 22
  - hostname: control-plane-02
    privateAddress: 100.80.147.13
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.80.147.13
      user: root
      port: 22
  - hostname: control-plane-03
    privateAddress: 100.88.64.99
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.88.64.99
      user: root
      port: 22
  - hostname: node-01
    privateAddress: 100.80.6.71
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.80.6.71
      user: root
      port: 22
  - hostname: node-02
    privateAddress: 100.68.19.83
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.68.19.83
      user: root
      port: 22
  - hostname: node-03
    privateAddress: 100.75.73.63
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.75.73.63
      user: root
      port: 22
  - hostname: node-04
    privateAddress: 100.107.241.34
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.107.241.34
      user: root
      port: 22
  - hostname: node-05
    privateAddress: 100.81.123.65
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.81.123.65
      user: root
      port: 22
  k0s:
    version: v1.36.3+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: tailscale-k0s
      spec:
        api:
          onlyBindToAddress: true
          sans:
          - control-plane-01
          - control-plane-02
          - control-plane-03
          - 100.76.72.67
          - 100.80.147.13
          - 100.88.64.99
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          kubeProxy:
            disabled: true
          nodeLocalLoadBalancing:
            enabled: true
            type: EnvoyProxy
  options:
    wait:
      enabled: false
