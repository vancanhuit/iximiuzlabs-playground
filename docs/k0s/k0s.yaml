apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: tailscale-k0s
spec:
  hosts:
  - hostname: control-plane-01
    privateAddress: 100.69.203.14
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.69.203.14
      user: root
      port: 22
  - hostname: control-plane-02
    privateAddress: 100.82.90.99
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.82.90.99
      user: root
      port: 22
  - hostname: control-plane-03
    privateAddress: 100.88.105.40
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.88.105.40
      user: root
      port: 22
  - hostname: node-01
    privateAddress: 100.82.128.100
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.82.128.100
      user: root
      port: 22
  - hostname: node-02
    privateAddress: 100.65.23.32
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.65.23.32
      user: root
      port: 22
  - hostname: node-03
    privateAddress: 100.70.236.20
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.70.236.20
      user: root
      port: 22
  - hostname: node-04
    privateAddress: 100.105.236.107
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.105.236.107
      user: root
      port: 22
  - hostname: node-05
    privateAddress: 100.70.196.57
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.70.196.57
      user: root
      port: 22
  k0s:
    version: v1.36.4+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: tailscale-k0s
      spec:
        api:
          onlyBindToAddress: true
          sans:
          - control-plane-01
          - control-plane-02
          - control-plane-03
          - 100.69.203.14
          - 100.82.90.99
          - 100.88.105.40
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          kubeProxy:
            disabled: true
          nodeLocalLoadBalancing:
            enabled: true
            type: EnvoyProxy
  options:
    wait:
      enabled: false
