apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: tailscale-k0s
spec:
  hosts:
  - hostname: control-plane-01
    privateAddress: 100.86.240.35
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.86.240.35
      user: root
      port: 22
  - hostname: control-plane-02
    privateAddress: 100.100.166.99
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.100.166.99
      user: root
      port: 22
  - hostname: control-plane-03
    privateAddress: 100.124.23.25
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.124.23.25
      user: root
      port: 22
  - hostname: node-01
    privateAddress: 100.64.105.87
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.64.105.87
      user: root
      port: 22
  - hostname: node-02
    privateAddress: 100.109.64.101
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.109.64.101
      user: root
      port: 22
  - hostname: node-03
    privateAddress: 100.79.84.125
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.79.84.125
      user: root
      port: 22
  - hostname: node-04
    privateAddress: 100.80.79.50
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.80.79.50
      user: root
      port: 22
  - hostname: node-05
    privateAddress: 100.104.224.76
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.104.224.76
      user: root
      port: 22
  k0s:
    version: v1.36.4+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: tailscale-k0s
      spec:
        api:
          onlyBindToAddress: true
          sans:
          - control-plane-01
          - control-plane-02
          - control-plane-03
          - 100.86.240.35
          - 100.100.166.99
          - 100.124.23.25
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          kubeProxy:
            disabled: true
          nodeLocalLoadBalancing:
            enabled: true
            type: EnvoyProxy
  options:
    wait:
      enabled: false
