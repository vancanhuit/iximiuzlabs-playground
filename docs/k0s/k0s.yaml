apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: tailscale-k0s
spec:
  hosts:
  - hostname: control-plane-01
    privateAddress: 100.122.131.107
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.122.131.107
      user: root
      port: 22
  - hostname: control-plane-02
    privateAddress: 100.70.63.35
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.70.63.35
      user: root
      port: 22
  - hostname: control-plane-03
    privateAddress: 100.102.136.11
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.102.136.11
      user: root
      port: 22
  - hostname: node-01
    privateAddress: 100.98.243.75
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.98.243.75
      user: root
      port: 22
  - hostname: node-02
    privateAddress: 100.113.182.20
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.113.182.20
      user: root
      port: 22
  - hostname: node-03
    privateAddress: 100.115.64.48
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.115.64.48
      user: root
      port: 22
  - hostname: node-04
    privateAddress: 100.90.242.121
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.90.242.121
      user: root
      port: 22
  - hostname: node-05
    privateAddress: 100.98.227.109
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.98.227.109
      user: root
      port: 22
  k0s:
    version: v1.36.4+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: tailscale-k0s
      spec:
        api:
          onlyBindToAddress: true
          sans:
          - control-plane-01
          - control-plane-02
          - control-plane-03
          - 100.122.131.107
          - 100.70.63.35
          - 100.102.136.11
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          kubeProxy:
            disabled: true
          nodeLocalLoadBalancing:
            enabled: true
            type: EnvoyProxy
  options:
    wait:
      enabled: false
