apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: tailscale-k0s
spec:
  hosts:
  - hostname: control-plane-01
    privateAddress: 100.95.45.121
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.95.45.121
      user: root
      port: 22
  - hostname: control-plane-02
    privateAddress: 100.70.208.100
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.70.208.100
      user: root
      port: 22
  - hostname: control-plane-03
    privateAddress: 100.83.139.69
    privateInterface: tailscale0
    role: controller
    ssh:
      address: 100.83.139.69
      user: root
      port: 22
  - hostname: node-01
    privateAddress: 100.97.186.122
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.97.186.122
      user: root
      port: 22
  - hostname: node-02
    privateAddress: 100.120.134.7
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.120.134.7
      user: root
      port: 22
  - hostname: node-03
    privateAddress: 100.102.21.94
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.102.21.94
      user: root
      port: 22
  - hostname: node-04
    privateAddress: 100.73.133.68
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.73.133.68
      user: root
      port: 22
  - hostname: node-05
    privateAddress: 100.77.100.23
    privateInterface: tailscale0
    role: worker
    ssh:
      address: 100.77.100.23
      user: root
      port: 22
  k0s:
    version: v1.36.4+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: tailscale-k0s
      spec:
        api:
          onlyBindToAddress: true
          sans:
          - control-plane-01
          - control-plane-02
          - control-plane-03
          - 100.95.45.121
          - 100.70.208.100
          - 100.83.139.69
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          kubeProxy:
            disabled: true
          nodeLocalLoadBalancing:
            enabled: true
            type: EnvoyProxy
  options:
    wait:
      enabled: false
