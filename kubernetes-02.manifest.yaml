kind: playground
name: kubernetes-02-8c3112d0
base: flexbox
title: Kubernetes 02
categories:
    - linux
    - networking
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: node-01
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
              mount: /
              size: 40GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 4GiB
        - name: node-02
          users:
            - name: root
