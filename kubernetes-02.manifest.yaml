kind: playground
name: kubernetes-02
base: flexbox
title: Kubernetes 02
categories:
  - linux
  - networking
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: control-plane-02
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 40GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: control-plane-03
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 40GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: node-04
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 40GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 4
        ramSize: 4GiB
    - name: node-05
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: oci://ghcr.io/vancanhuit/debian-rootfs:trixie-base
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
  tabs:
    - id: terminal-control-plane-02
      kind: terminal
      name: control-plane-02
      machine: control-plane-02
    - id: terminal-control-plane-03
      kind: terminal
      name: control-plane-03
      machine: control-plane-03
    - id: terminal-node-04
      kind: terminal
      name: node-04
      machine: node-04
    - id: terminal-node-05
      kind: terminal
      name: node-05
      machine: node-05
  initTasks:
    init_control_plane_02_1:
      name: init_control_plane_02_1
      machine: control-plane-02
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        perl -p -i.bak -e 's/^(?!(127\.0\.0\.1|::1|fe|ff|#)).*$//g ; s/^\s*$//g' /etc/hosts

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
    init_control_plane_03_1:
      name: init_control_plane_03_1
      machine: control-plane-03
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        perl -p -i.bak -e 's/^(?!(127\.0\.0\.1|::1|fe|ff|#)).*$//g ; s/^\s*$//g' /etc/hosts

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
    init_node_04_1:
      name: init_node_04_1
      machine: node-04
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        perl -p -i.bak -e 's/^(?!(127\.0\.0\.1|::1|fe|ff|#)).*$//g ; s/^\s*$//g' /etc/hosts

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
    init_node_05_1:
      name: init_node_05_1
      machine: node-05
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash

        perl -p -i.bak -e 's/^(?!(127\.0\.0\.1|::1|fe|ff|#)).*$//g ; s/^\s*$//g' /etc/hosts

        curl -fsSL https://tailscale.com/install.sh | sh
        systemctl enable --now tailscaled
  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner
